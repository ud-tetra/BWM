name: Website source verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Unit and route tests
        run: bunx vitest run
      - name: Lint (existing React Refresh warnings permitted)
        run: bunx eslint . --max-warnings 6
      - name: Build production assets
        run: bun run build
